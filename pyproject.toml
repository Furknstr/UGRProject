[project]
name = "ugr-booking"
version = "0.1.0"
description = "AI-powered email booking extraction and validation pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.4.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.40",
    "python-dotenv>=1.0",
    "plotly>=5.0",
    "rapidfuzz>=3.14.6",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ugr_booking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
